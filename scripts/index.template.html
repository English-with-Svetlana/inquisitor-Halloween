<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<link rel="preload" as="image" href="{{poster}}">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #transition { position: relative; width: 100%; height: 100%; }
  img, video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; }
  img { display: block; }
  video { opacity: 0; }
  video.ready { opacity: 1; }
</style>
</head>
<body>
<div id="transition">
  <img src="{{poster}}" alt="" fetchpriority="high">
  <video autoplay muted playsinline preload="auto" poster="{{poster}}" disablepictureinpicture src="{{video}}"></video>
</div>
<script>
(() => {
  const video = document.querySelector('video');
  let failed = false;
  let hidden = document.hidden;
  let suspended = false;
  let generation = 0;
  video.muted = true;
  video.defaultMuted = true;
  function fallback() {
    generation++;
    video.classList.remove('ready');
  }
  function reveal() {
    const current = generation;
    const show = () => {
      if (current === generation && !failed && !document.hidden && video.readyState >= 2) {
        video.classList.add('ready');
      }
    };
    if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(show);
    else show();
  }
  function play() {
    if (failed || document.hidden) return;
    try {
      const attempt = video.play();
      if (attempt) attempt.catch(() => { if (video.paused) fallback(); });
    } catch (_) { fallback(); }
  }
  function restart() {
    if (failed) return;
    fallback();
    try { video.currentTime = 0; } catch (_) { return; }
    play();
  }
  video.addEventListener('playing', reveal);
  video.addEventListener('error', () => { failed = true; fallback(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hidden = true; video.pause(); }
    else if (hidden) { hidden = false; restart(); }
  });
  window.addEventListener('pagehide', () => { suspended = true; video.pause(); });
  window.addEventListener('pageshow', () => {
    if (suspended) { suspended = false; hidden = document.hidden; restart(); }
  });
  play();
})();
</script>
</body>
</html>
