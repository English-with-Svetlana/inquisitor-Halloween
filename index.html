<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<link rel="preload" as="image" href="assets/poster.aab5295c17334f6e.jpg" fetchpriority="high">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { display: grid; place-items: center; }
  #transition { position: relative; width: min(100vw, 177.777778vh); aspect-ratio: 16 / 9; }
  img, video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; }
  img, video { display: block; }
  [hidden] { display: none; }
  video { background: transparent; pointer-events: none; }
</style>
</head>
<body>
<div id="transition">
  <img hidden src="assets/poster.aab5295c17334f6e.jpg" alt="" fetchpriority="high">
  <video autoplay muted loop playsinline preload="auto" poster="assets/poster.aab5295c17334f6e.jpg" disablepictureinpicture src="assets/transition.65452ecc945ae30e.mp4"></video>
</div>
<script>
(() => {
  const video = document.querySelector('video');
  const poster = document.querySelector('img');
  let failed = false;
  let suspended = document.hidden;
  video.autoplay = true;
  video.loop = true;
  video.playsInline = true;
  video.controls = false;
  video.removeAttribute('controls');
  video.muted = true;
  video.defaultMuted = true;
  video.volume = 0;
  function fallback() {
    video.hidden = true;
    poster.hidden = false;
  }
  function play() {
    if (failed || document.hidden || !video.paused) return;
    video.hidden = false;
    try {
      const attempt = video.play();
      if (attempt) attempt.catch(() => { if (video.paused) fallback(); });
    } catch (_) { fallback(); }
  }
  // Use the browser's native poster lifecycle: no opacity or frame-callback gate.
  video.addEventListener('playing', () => {
    if (!failed) { video.hidden = false; poster.hidden = true; }
  });
  video.addEventListener('error', () => { failed = true; fallback(); });
  function hide() { suspended = true; video.pause(); }
  function resume() {
    if (suspended && !document.hidden) { suspended = false; play(); }
  }
  document.addEventListener('visibilitychange', () => document.hidden ? hide() : resume());
  window.addEventListener('pagehide', hide);
  window.addEventListener('pageshow', resume);
  play();
})();
</script>
</body>
</html>
